name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install bats
        run: sudo apt-get update && sudo apt-get install -y bats python3 python3-pytest shellcheck
      - name: Bats tests
        run: bats tests/*.bats
      - name: Python tests
        run: python3 -m pytest -q
      - name: Shellcheck
        run: shellcheck -x svd lib/*.sh payload/*.sh bootstrap.sh
